[package]
name = "launchtorrent"
version = "0.1.0"
edition = "2021"
description = "Cliente BitTorrent desktop com UI nativa (egui) e motor librqbit"
license = "MIT"
readme = "README.md"

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
librqbit = "9.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
bytes = "1"
dirs = "6"
arboard = "3"

[profile.release]
lto = true
codegen-units = 1
